<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finance Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <h1>💸 Personal Finance Tracker</h1>

    <div class="form">
      <input type="text" id="description" placeholder="Description" />
      <input type="number" id="amount" placeholder="Amount (₹)" />
      <select id="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
      <button onclick="addTransaction()">Add</button>
    </div>

    <div class="summary">
      <h3>Total Income: ₹<span id="totalIncome">0</span></h3>
      <h3>Total Expense: ₹<span id="totalExpense">0</span></h3>
      <h3>Balance: ₹<span id="balance">0</span></h3>
    </div>

    <h2>Transactions</h2>
    <table id="transactionTable">
      <thead>
        <tr><th>Description</th><th>Amount</th><th>Type</th><th>Delete</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>Expense by Category</h2>
    <canvas id="expenseChart"></canvas>

  <!-- Download Report Button -->
  <button onclick="downloadReport()">⬇️ Download Report</button>

  </div>



  <script src="app.js"></script>
</body>
</html>
